[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earshot"
version = "0.3.0"
description = "Podcast and AI-news intelligence agent — monitors YouTube podcasts, summarizes episodes, extracts new concepts, scouts AI news, delivers via email and outbound voice call."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "a_alkishawi", email = "a_alkishawi@yahoo.com" }]
keywords = ["podcast", "ai", "news", "digest", "claude", "summarization", "twilio", "youtube"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "anthropic>=0.40",
    "click>=8.1",
    "fastapi>=0.115",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "requests>=2.31",
    "twilio>=9.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2024.10.0",
]

[project.urls]
Homepage = "https://github.com/aalkishawi/earshot"
Issues = "https://github.com/aalkishawi/earshot/issues"

[project.scripts]
earshot = "earshot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["earshot*"]
