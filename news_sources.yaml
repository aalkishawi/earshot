# Earshot — AI news scout sources.
#
# Supported types (handled in news_scout.py):
#   - rss : standard RSS/Atom/RDF feed URL (parsed via feedparser)
#   - hn  : Hacker News Algolia search filtered by keywords + min_points
#
# First-sync policy: on a source's first appearance in the database, all
# currently-visible items are marked state='skipped' (baseline) so we don't
# LLM-score the backlog. From the second run onward, genuinely new items
# get state='seen' and feed into the relevance scorer.
#
# All sources are deduped on URL.

sources:
  # Community-maintained Anthropic news mirror (Anthropic does not publish
  # an official RSS feed as of 2026-06).
  - name: Anthropic
    type: rss
    url: https://raw.githubusercontent.com/taobojlen/anthropic-rss-feed/main/anthropic_news_rss.xml

  - name: OpenAI
    type: rss
    url: https://openai.com/news/rss.xml

  - name: Google DeepMind
    type: rss
    url: https://deepmind.google/blog/rss.xml

  - name: Hugging Face
    type: rss
    url: https://huggingface.co/blog/feed.xml

  - name: Simon Willison
    type: rss
    url: https://simonwillison.net/atom/everything/

  # Swyx + Alessio — long-form podcast-driven AI commentary.
  - name: Latent Space
    type: rss
    url: https://www.latent.space/feed

  # Jack Clark (Anthropic co-founder) — weekly AI policy + capabilities digest.
  - name: Import AI
    type: rss
    url: https://importai.substack.com/feed

  - name: Hacker News (AI filter)
    type: hn
    keywords: ["AI", "LLM", "GPT", "Claude", "Anthropic", "OpenAI", "Gemini", "DeepMind"]
    min_points: 100
